<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vladimir Vlasov</title>
  <meta name="description" content="Vladimir Vlasov — growth manager, triathlete.">
  <meta property="og:title" content="Vladimir Vlasov">
  <meta property="og:description" content="husband · father · son · brother · growth manager · triathlete">
  <meta property="og:type" content="profile">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%231c4fd9'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Segoe UI,sans-serif' font-size='28' font-weight='600' fill='white' text-anchor='middle'%3EVV%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111;
      --muted: #666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --fg: #f3f3f3;
        --muted: #8a8a8a;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem 4rem;
    }
    .card {
      text-align: center;
      max-width: 560px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.75rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c92ff 0%, #1c4fd9 100%);
      color: white;
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 30px rgba(28, 79, 217, 0.25);
      user-select: none;
    }
    h1 {
      margin: 0 0 0.85rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p.bio {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      line-height: 1.7;
    }
    p.bio span { white-space: nowrap; }
    p.bio span + span::before {
      content: " · ";
      margin: 0 0.3rem;
      opacity: 0.55;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }
    footer a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="avatar" aria-hidden="true">VV</div>
      <h1>Vladimir Vlasov</h1>
      <p class="bio">
        <span>man</span><span>husband</span><span>father</span><span>son</span><span>brother</span><span>growth manager</span><span>triathlete</span>
      </p>
    </div>
  </main>
  <footer>
    <a href="https://github.com/1vlasov">github.com/1vlasov</a>
  </footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vladimir Vlasov</title>
  <meta name="description" content="Vladimir Vlasov — manager, triathlete.">
  <meta property="og:title" content="Vladimir Vlasov">
  <meta property="og:description" content="man · husband · father · son · brother · manager · triathlete">
  <meta property="og:type" content="profile">
  <meta name="theme-color" content="#f4ede0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#050d1c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23050d1c'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Segoe UI,sans-serif' font-size='28' font-weight='600' fill='%23ede1c8' text-anchor='middle'%3EVV%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4ede0;
      --fg: #2a2520;
      --muted: #7a6f5c;
      --accent: #cc6633;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #050d1c;
        --fg: #ede1c8;
        --muted: #6d7d92;
        --accent: #e07a3f;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem 2rem;
    }
    .card {
      text-align: center;
      max-width: 36rem;
      width: 100%;
    }
    .avatar {
      width: clamp(120px, 32vw, 150px);
      aspect-ratio: 1;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background-image: url('avatar.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 0.85rem;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    ul.bio {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      color: var(--muted);
      font-size: clamp(0.95rem, 3.6vw, 1.05rem);
      line-height: 1.6;
    }
    ul.bio li { display: flex; align-items: baseline; }
    ul.bio li:not(:last-child)::after {
      content: "·";
      margin: 0 0.55rem;
      opacity: 0.55;
    }
    .links {
      margin-top: 1.75rem;
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 1px;
    }
    .links a:hover { opacity: 0.75; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="avatar" role="img" aria-label="Vladimir Vlasov"></div>
      <h1>Vladimir Vlasov</h1>
      <ul class="bio">
        <li>man</li>
        <li>husband</li>
        <li>father</li>
        <li>son</li>
        <li>brother</li>
        <li>manager</li>
        <li>triathlete</li>
      </ul>
      <div class="links">
        <a href="memo.html">memo</a>
      </div>
    </div>
  </main>
</body>
</html>
